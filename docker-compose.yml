version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: miturno_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-miturno}
      POSTGRES_USER:     ${DB_USER:-miturno_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-MiTurnoPass2026!}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-miturno_user} -d ${DB_NAME:-miturno}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - miturno_net

  # ── Backend (Node.js / Express / Socket.io) ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: miturno_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV:    ${NODE_ENV:-development}
      PORT:        ${BACKEND_PORT:-3000}
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-miturno}
      DB_USER:     ${DB_USER:-miturno_user}
      DB_PASSWORD: ${DB_PASSWORD:-MiTurnoPass2026!}
      JWT_SECRET:  ${JWT_SECRET:-m1_turno_sup3r_s3cret_jwt_k3y_2026}
      JWT_EXPIRES: ${JWT_EXPIRES:-24h}
      SEED_DB:     ${SEED_DB:-true}
      SMTP_HOST:   ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT:   ${SMTP_PORT:-587}
      SMTP_USER:   ${SMTP_USER:-}
      SMTP_PASS:   ${SMTP_PASS:-}
      SMTP_FROM:   ${SMTP_FROM:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - miturno_net

  # ── Frontend (Nginx) ────────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: miturno_web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - miturno_net

volumes:
  pg_data:
    driver: local

networks:
  miturno_net:
    driver: bridge
